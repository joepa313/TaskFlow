<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="auth-screen">
        <div class="auth-container">
            <h1>TaskFlow</h1>
            <p class="auth-subtitle">Your tasks. Organized.</p>

            <div class="auth-tabs">
                <button type="button" id="login-tab" class="active">
                    Login
                </button>

                <button type="button" id="signup-tab">
                    Create Account
                </button>
            </div>

            <form id="auth-form">
                <input
                    type="email"
                    id="auth-email"
                    placeholder="Email address"
                    required
                >

                <input
                    type="password"
                    id="auth-password"
                    placeholder="Password"
                    required
                >

                <button type="submit" id="auth-submit">
                    Login
                </button>
            </form>

            <button type="button" id="forgot-password">
                Forgot password?
            </button>

            <p id="auth-message"></p>
        </div>
    </div>


    <!-- MAIN APPLICATION -->
    <div id="app" hidden>

        <div class="app-container">

            <!-- SIDEBAR -->
            <aside class="sidebar">

                <h1>TaskFlow</h1>

                <nav>
                    <button class="filter-btn active" data-filter="all">
                        All Tasks
                    </button>

                    <button class="filter-btn" data-filter="pending">
                        Pending
                    </button>

                    <button class="filter-btn" data-filter="completed">
                        Completed
                    </button>
                </nav>

                <div class="account-section">
                    <p id="account-email"></p>
                    <button id="logout-btn">Log Out</button>
                </div>

            </aside>


            <!-- MAIN CONTENT -->
            <main class="main-content">

                <header class="page-header">
                    <h2>My Dashboard</h2>
                    <p>Keep track of everything you need to get done.</p>
                </header>


                <!-- DASHBOARD STATISTICS -->
                <section class="dashboard">

                    <div class="stat-card">
                        <h3>Total Tasks</h3>
                        <p id="total-tasks">0</p>
                    </div>

                    <div class="stat-card">
                        <h3>Pending</h3>
                        <p id="pending-tasks">0</p>
                    </div>

                    <div class="stat-card">
                        <h3>Completed</h3>
                        <p id="completed-tasks">0</p>
                    </div>

                </section>


                <!-- ADD TASK -->
                <section class="add-task-section">

                    <h2>Add a New Task</h2>

                    <form id="task-form">

                        <input
                            type="text"
                            id="task-title"
                            placeholder="Task title"
                            required
                        >

                        <input
                            type="text"
                            id="task-description"
                            placeholder="Description"
                        >

                        <input
                            type="date"
                            id="task-date"
                        >

                        <select id="task-priority">
                            <option value="Low">Low Priority</option>
                            <option value="Medium" selected>
                                Medium Priority
                            </option>
                            <option value="High">High Priority</option>
                        </select>

                        <select id="task-category">
                            <option value="Personal">Personal</option>
                            <option value="Work">Work</option>
                            <option value="School">School</option>
                            <option value="Other">Other</option>
                        </select>

                        <button type="submit">Add Task</button>

                    </form>

                </section>


                <!-- TASK LIST -->
                <section class="task-section">

                    <div class="task-heading">
                        <h2>My Tasks</h2>

                        <input
                            type="text"
                            id="search-input"
                            placeholder="Search tasks..."
                        >
                    </div>

                    <div id="task-list"></div>

                </section>

            </main>

        </div>

    </div>


    <!-- EDIT TASK MODAL -->
    <div id="edit-modal" class="modal">

        <div class="modal-content">

            <button
                type="button"
                id="close-modal"
                class="close-btn"
            >
                &times;
            </button>

            <h2>Edit Task</h2>

            <form id="edit-form">

                <input
                    type="text"
                    id="edit-title"
                    placeholder="Task title"
                    required
                >

                <input
                    type="text"
                    id="edit-description"
                    placeholder="Description"
                >

                <input
                    type="date"
                    id="edit-date"
                >

                <select id="edit-priority">
                    <option value="Low">Low Priority</option>
                    <option value="Medium">Medium Priority</option>
                    <option value="High">High Priority</option>
                </select>

                <select id="edit-category">
                    <option value="Personal">Personal</option>
                    <option value="Work">Work</option>
                    <option value="School">School</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Save Changes</button>

            </form>

        </div>

    </div>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- APPLICATION JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
